name: Font validation
on:
  push:
    branches: [main, 'automation/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/automation/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fontforge lcdf-typetools texlive-xetex texlive-font-utils texlive-latex-extra
      - run: python -m pip install -r scripts/automation/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: bash scripts/automation/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teretisma-build
          path: build/
